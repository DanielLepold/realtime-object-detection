model:
  weights: yolov8x.pt         # n / s / m / l / x – larger = slower but more accurate
  conf_threshold: 0.3
  iou_threshold: 0.5
  tracker: bytetrack           # bytetrack | botsort
  device: ""                   # "" = auto (cuda → mps → cpu)
  person_class_id: 0           # COCO class id for "person"
  ball_class_id: 32            # COCO class id for "sports ball"

camera:
  use_stabilization: true
  max_corners: 100             # Shi-Tomasi corners tracked per frame
  quality_level: 0.3
  min_distance: 3.0
  block_size: 7

field:
  # Pixel coordinates of the four visible field corners in the source video.
  # Order: top-left, top-right, bottom-right, bottom-left.
  # Set to null to skip homography (speed/distance will use a linear fallback).
  corners: null
  real_width_m: 68.0           # standard football pitch width
  real_length_m: 105.0         # standard football pitch length
  minimap_scale: 0.22          # minimap width as fraction of frame width

team:
  kmeans_clusters: 2
  color_space: LAB             # LAB | HSV  (LAB is more perceptually uniform)

metrics:
  speed_smoothing_window: 5    # rolling-average window in frames
  distance_smoothing_window: 3

fit_frames: 30                 # frames collected before fitting the team classifier

output:
  show_minimap: true
  show_speed: true
  show_distance: true
  video_codec: mp4v
